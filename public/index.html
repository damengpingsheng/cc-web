<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CC-Web</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" href="favicon-512.png">
  <script>
    (function () {
      var theme = localStorage.getItem('cc-web-theme') || 'washi';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=1.5.1-my.66">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
  <!-- Login -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <div class="login-logo">CC</div>
      <h2>CC-Web</h2>
      <p>Claude / Codex Web Chat</p>
      <form id="login-form">
        <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password" autofocus>
        <button type="submit">登录</button>
      </form>
      <div id="login-error" class="login-error" hidden>密码错误</div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app" hidden>
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="new-chat-split">
          <button id="new-chat-btn" class="new-chat-btn">+ 新会话</button>
          <button id="new-chat-arrow" class="new-chat-arrow" title="更多">▾</button>
        </div>
        <div id="new-chat-dropdown" class="new-chat-dropdown" hidden>
          <button id="import-session-btn">导入本地 CLI 会话</button>
          <button id="add-group-btn">新建分组</button>
        </div>
        <button id="session-overview-btn" class="session-overview-entry" type="button">
          <span class="session-overview-entry-mark" aria-hidden="true"><i></i><i></i></span>
          <span class="session-overview-entry-text">会话总台</span>
          <span id="session-overview-entry-count" class="session-overview-entry-count">0</span>
        </button>
      </div>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-footer">
        <button id="settings-btn" class="settings-btn" title="设置">⚙</button>
        <span class="brand">CC-Web</span>
        <button id="sidebar-collapse-btn" class="settings-btn sidebar-collapse-btn" title="收起会话列表">«</button>
      </div>
      <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="拖动调整会话列宽度" title="拖动调整会话列宽度"></div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

    <!-- Chat -->
    <main class="chat-main">
      <header class="chat-header">
        <button id="menu-btn" class="menu-btn" title="菜单">☰</button>
        <span id="chat-title" class="chat-title">新会话</span>
        <button id="chat-agent-btn" class="chat-agent-btn" type="button" aria-haspopup="menu" aria-expanded="false">Claude</button>
        <button id="chat-gateway" class="chat-gateway" type="button" aria-haspopup="menu" aria-expanded="false" hidden></button>
        <div id="chat-gateway-menu" class="chat-agent-menu chat-gateway-menu" hidden>
          <button type="button" class="chat-agent-option" data-gateway="apirouter">公司 apirouter</button>
          <button type="button" class="chat-agent-option" data-gateway="localproxy">本地代理 (127.0.0.1:8787)</button>
        </div>
        <div id="chat-agent-menu" class="chat-agent-menu" hidden>
          <button type="button" class="chat-agent-option active" data-agent="claude">Claude</button>
          <button type="button" class="chat-agent-option" data-agent="codex">Codex</button>
        </div>
        <span id="chat-runtime-state" class="chat-runtime-state" hidden>运行中</span>
        <span id="chat-cwd" class="chat-cwd" hidden></span>
        <select id="mode-select" class="mode-select" title="权限模式">
          <option value="yolo">YOLO</option>
          <option value="default">默认</option>
          <option value="plan">Plan</option>
        </select>
        <span id="cost-display" class="cost-display" hidden></span>
      </header>

      <div id="goal-status-bar" class="goal-status-bar" hidden role="status" aria-live="polite">
        <span class="goal-status-icon" aria-hidden="true">◎</span>
        <span class="goal-status-label">Goal active</span>
        <span id="goal-status-turns" class="goal-status-turns">评估 0</span>
        <span id="goal-status-feedback" class="goal-status-feedback"></span>
        <button type="button" id="goal-status-stop" class="goal-status-stop" title="停止 Goal">停止</button>
      </div>

      <div id="conn-banner" class="conn-banner" hidden role="status" aria-live="polite">
        <span class="conn-banner-icon" aria-hidden="true">⚠</span>
        <span class="conn-banner-text">连接已断开，正在自动重连……期间发送的内容会保留在输入框</span>
      </div>

      <div class="messages-wrap">
        <div id="msg-search" class="msg-search" hidden>
          <svg class="msg-search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4.3"/><path d="M10 10l3.6 3.6"/></svg>
          <input id="msg-search-input" type="text" placeholder="搜索本会话" autocomplete="off" spellcheck="false" aria-label="搜索当前会话消息">
          <span id="msg-search-count" class="msg-search-count"></span>
          <label class="msg-search-scope" title="包含工具调用和导入的本地命令">
            <input id="msg-search-include-tools" type="checkbox" checked>
            <span>含工具</span>
          </label>
          <label class="msg-search-scope" title="区分大小写">
            <input id="msg-search-case-sensitive" type="checkbox">
            <span>区分大小写</span>
          </label>
          <label class="msg-search-scope" title="仅匹配完整的单词或短语">
            <input id="msg-search-whole-word" type="checkbox">
            <span>全词</span>
          </label>
          <button type="button" id="msg-search-prev" class="msg-search-btn" title="上一个 (Shift+Enter)" aria-label="上一个匹配">‹</button>
          <button type="button" id="msg-search-next" class="msg-search-btn" title="下一个 (Enter)" aria-label="下一个匹配">›</button>
          <button type="button" id="msg-search-close" class="msg-search-btn" title="关闭 (Esc)" aria-label="关闭搜索">✕</button>
        </div>
        <div id="messages" class="messages">
          <div class="welcome-msg">
            <div class="welcome-icon">✿</div>
            <h3>欢迎使用 CC-Web</h3>
            <p>开始与 Claude 对话</p>
          </div>
        </div>
        <!-- 提问导航条：与右侧滚动条分轨放置，避免拖动和跳转误触 -->
        <div class="msg-nav" id="msg-nav" aria-hidden="true"></div>
        <div class="msg-nav-tip" id="msg-nav-tip" hidden></div>
        <div class="custom-scrollbar" id="custom-scrollbar">
          <div class="custom-scrollbar-thumb" id="custom-scrollbar-thumb"></div>
        </div>
        <div class="scroll-jump" id="scroll-jump" hidden>
          <button type="button" class="scroll-jump-btn" id="scroll-jump-top" title="到最前" aria-label="跳到最前">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h10M4.5 8.5 8 5l3.5 3.5M4.5 13 8 9.5l3.5 3.5"/></svg>
          </button>
          <button type="button" class="scroll-jump-btn" id="scroll-jump-bottom" title="到最后" aria-label="跳到最后">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13h10M4.5 3 8 6.5 11.5 3M4.5 7.5 8 11l3.5-3.5"/></svg>
          </button>
        </div>
      </div>

      <!-- Slash command menu -->
      <div id="cmd-menu" class="cmd-menu" hidden></div>

      <div class="input-area">
        <div id="message-queue" class="message-queue" hidden role="status" aria-live="polite"></div>
        <div id="attachment-tray" class="attachment-tray" hidden></div>
        <div class="input-wrapper">
          <input id="image-upload-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
          <button type="button" id="chat-model-state" class="chat-model-state" title="点击切换模型 / 思考强度" hidden></button>
          <button id="attach-btn" class="attach-btn" title="上传图片" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-8.49 8.49a6 6 0 1 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <textarea id="msg-input" rows="1" placeholder="输入消息… 输入 / 查看指令" autocomplete="off"></textarea>
          <button id="send-btn" class="send-btn" title="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
          <button id="abort-btn" class="abort-btn" title="停止" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <section id="session-overview" class="session-overview" role="dialog" aria-modal="true" aria-labelledby="session-overview-title" aria-describedby="session-overview-summary" hidden>
    <header class="session-overview-header">
      <div class="session-overview-heading">
        <h1 id="session-overview-title">会话总台</h1>
        <p id="session-overview-summary"><span id="session-overview-total">0</span> 条会话，来自 Claude 与 Codex</p>
      </div>
      <label class="session-overview-search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.6 12.6 4 4"/></svg>
        <input id="session-overview-search" type="search" placeholder="搜索标题、项目或会话 ID" autocomplete="off" spellcheck="false" aria-label="搜索全部会话">
        <span id="session-overview-match-count" class="session-overview-match-count"></span>
      </label>
      <div class="session-overview-actions">
        <button id="session-overview-title-audit" class="session-overview-title-audit" type="button" title="识别并整理从首条提问派生的会话标题">整理标题</button>
        <button id="session-overview-close" class="session-overview-close" type="button">返回会话 <kbd>Esc</kbd></button>
      </div>
    </header>
    <div class="session-overview-controls">
      <div class="session-overview-filter-group" role="group" aria-label="按 Agent 筛选">
        <button type="button" class="session-overview-filter active" data-overview-agent="all">全部 <span id="session-overview-agent-all-count">0</span></button>
        <button type="button" class="session-overview-filter" data-overview-agent="claude">Claude <span id="session-overview-agent-claude-count">0</span></button>
        <button type="button" class="session-overview-filter" data-overview-agent="codex">Codex <span id="session-overview-agent-codex-count">0</span></button>
      </div>
      <div class="session-overview-filter-group session-overview-status-filters" role="group" aria-label="按状态筛选">
        <button type="button" class="session-overview-filter active" data-overview-status="all">全部状态</button>
        <button type="button" class="session-overview-filter" data-overview-status="running">运行中 <span id="session-overview-running-count">0</span></button>
        <button type="button" class="session-overview-filter" data-overview-status="unread">未读 <span id="session-overview-unread-count">0</span></button>
        <button type="button" class="session-overview-filter" data-overview-status="favorite">收藏 <span id="session-overview-favorite-count">0</span></button>
      </div>
    </div>
    <div class="session-overview-scroll">
      <div id="session-overview-focus" class="session-overview-focus" hidden></div>
      <div id="session-overview-list" class="session-overview-list"></div>
    </div>
    <div id="session-title-audit" class="session-title-audit" hidden>
      <section class="session-title-audit-panel" role="dialog" aria-modal="true" aria-labelledby="session-title-audit-heading" aria-describedby="session-title-audit-description">
        <header class="session-title-audit-header">
          <div>
            <span class="session-title-audit-eyebrow">标题整理</span>
            <h2 id="session-title-audit-heading">会话标题体检</h2>
            <p id="session-title-audit-description">只处理沿用首条提问的标题，应用前可逐条修改。</p>
          </div>
          <button id="session-title-audit-close" class="modal-close-btn" type="button" aria-label="关闭标题整理">✕</button>
        </header>
        <div id="session-title-audit-status" class="session-title-audit-status" role="status" aria-live="polite"></div>
        <div id="session-title-audit-list" class="session-title-audit-list"></div>
        <footer class="session-title-audit-footer">
          <p>规则：概括整段会话实际工作，去掉提问外壳；无明确结论时使用中性动词。</p>
          <div>
            <button id="session-title-audit-cancel" class="modal-btn-secondary" type="button">取消</button>
            <button id="session-title-audit-apply" class="modal-btn-primary" type="button" disabled>应用所选</button>
          </div>
        </footer>
      </section>
    </div>
  </section>

  <div id="session-loading-overlay" class="session-loading-overlay" hidden aria-live="polite" aria-hidden="true">
    <div class="session-loading-card" role="status" aria-busy="true">
      <div class="session-loading-badge">Session</div>
      <div class="session-loading-title">会话加载中</div>
      <div id="session-loading-label" class="session-loading-label">正在整理消息与上下文…</div>
      <div class="session-loading-bar">
        <span class="session-loading-bar-fill"></span>
      </div>
    </div>
  </div>

  <!-- 拖动会话列宽度期间接管光标与文字选择的整页遮罩（见 style.css #drag-shield） -->
  <div id="drag-shield" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.11/purify.min.js"></script>
  <script src="app.js?v=1.5.1-my.66"></script>
</body>
</html>
